databases:
  - name: sistema-barbearia-db
    region: oregon
    plan: free
    disk: 512
    envVars:
      - key: DATABASE_URL
        sync: false

services:
	- type: web
		name: sistema-barbearia-backend]
    runtime: python
		plan: free
		region: oregon
		branch: main
		buildCommand: pip install -r requirements.txt
		startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --workers 2
		envVars:
			- key: DATABASE_URL
				sync: false
			- key: SECRET_KEY
				sync: false
		disk: 512
		instanceType: starter
		healthCheckPath: /health
		autoDeploy: true

# Notes:
# - Render will use this file when creating the service from the repo.
# - Ensure `gunicorn` is present in `requirements.txt` or change `startCommand` to `uvicorn main:app --host 0.0.0.0 --port $PORT`.
