databases:
	- name: sistema-barbearia-db
		region: oregon
		plan: starter
		disk: 512

services:
	- type: web
		name: sistema-barbearia-backend
		env: python
		plan: starter
		region: oregon
		branch: prod
		buildCommand: pip install -r requirements.txt
		# Use python -m gunicorn to avoid PATH issues that can cause exit code 127
		startCommand: python -m gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --workers 2
		envVars:
			- key: SECRET_KEY
				sync: false
		healthCheckPath: /health
		autoDeploy: true

# Notes:
# - Render will use this file when creating the service from the repo.
# - After creating the managed DB in Render, set DATABASE_URL in the Service Environment variables.
